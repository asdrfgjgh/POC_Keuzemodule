name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          app_location: "Frontend" # App source code path (De './' is weggelaten, wat vaak voorkeur heeft)
          # 🌟 OPLOSSING 1: De Nuxt/Nitro build plaatst de statische bestanden in deze map,
          # RELATIEF ten opzichte van de app_location (Frontend).
          output_location: ".output/public" # Built app content directory - optional
          # 🌟 OPLOSSING 2: De Nitro server component moet als Azure Function worden ingezet.
          # Dit is het pad dat Nitro creëert, RELATIEF ten opzichte van de app_location.
          api_location: ".output/server/functions" # Api source code path - Dit is de Nuxt/Nitro server
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # 🌟 TOEGEVOEGD: Forceer Node.js 20.x voor de API-build 🌟
          NODE_VERSION: "20.x"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN}}
          action: "close"
