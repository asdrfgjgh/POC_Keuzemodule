name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: "keuzemodule-frontend"
  NODE_VERSION: "18.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    environment: "production"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm install
          npm ci

      - name: Build application
        run: |
          npm run build
        env:
          BACKEND_URL: "https://apijobbahub.azurewebsites.net"
          API_BASE_URL: "https://apijobbahub.azurewebsites.net/api"

      - name: Create deployment package
        run: |
          zip -r app.zip .output -x "*.map"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip

  configure-cors:
    runs-on: ubuntu-latest
    name: Configure CORS
    needs: build-and-deploy
    if: always()

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure CORS for backend
        run: |
          az webapp cors add \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name apijobbahub \
            --allowed-origins "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
