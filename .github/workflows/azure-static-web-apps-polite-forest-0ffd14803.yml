name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: "keuzemodule-frontend"
  # FIX: Verhoog de Node.js versie naar 20.x, vereist door Nuxt/Vite packages.
  NODE_VERSION: "20.x"
  # Backend naam voor de CORS configuratie job
  AZURE_BACKEND_NAME: "apijobbahub"
  # URL van de SWA, afgeleid van de AZURE_WEBAPP_NAME
  FRONTEND_URL: "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    environment: "production"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Gebruik v4 om de Node.js versie in te stellen.
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        # Gebruik 'npm ci' voor schone en betrouwbare installaties in CI/CD.
        run: npm ci

      - name: Build application
        run: |
          # npm run build gebruikt de lokale nuxt binary, wat 'Permission denied' voorkomt.
          npm run build
        env:
          # Deze omgevingsvariabelen worden doorgegeven aan de build stap.
          BACKEND_URL: "https://${{ env.AZURE_BACKEND_NAME }}.azurewebsites.net"
          API_BASE_URL: "https://${{ env.AZURE_BACKEND_NAME }}.azurewebsites.net/api"

      - name: Create deployment package
        # Zorg ervoor dat '.output' de juiste map is voor jouw Nuxt build.
        run: |
          zip -r app.zip .output -x "*.map"

      # 🎯 FIX: Azure Login toevoegen VOOR de webapps-deploy actie.
      - name: Azure Login for Deployment
        uses: azure/login@v1
        with:
          # Gebruik de Service Principal credentials (JSON)
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          # Gebruik het publish profile als alternatief voor de login stap als deze faalt,
          # maar de login stap is al toegevoegd als de standaard oplossing.
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip

  # ----------------------------------------------------------------------------------------------------------------------

  configure-cors:
    runs-on: ubuntu-latest
    name: Configure CORS
    # Zorg dat de deployment succesvol is voordat CORS wordt geconfigureerd
    needs: build-and-deploy
    if: success()

    steps:
      - name: Azure Login for CORS Configuration
        uses: azure/login@v1
        with:
          # Gebruik de Service Principal credentials (JSON)
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure CORS for backend (apijobbahub)
        run: |
          # De SWA URL (https://keuzemodule-frontend.azurewebsites.net) toevoegen aan de App Service CORS instellingen.
          az webapp cors add \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_BACKEND_NAME }} \
            --allowed-origins ${{ env.FRONTEND_URL }}
