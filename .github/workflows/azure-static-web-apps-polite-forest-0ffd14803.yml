name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: "keuzemodule-frontend"
  # 🎯 FIX 1: Verhoog de Node.js versie naar 20.x
  NODE_VERSION: "20.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    environment: "production"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Gebruik de nieuwste actie versie (v4 is aanbevolen)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 🎯 FIX 2: Gebruik alleen 'npm install' of 'npm ci', niet beide. 'npm ci' is beter voor CI/CD.
      - name: Install dependencies
        run: npm ci

      # 🎯 FIX 3: Installeer lokaal gebruikte binaries (zoals 'nuxt') om 'Permission denied' te voorkomen.
      # De build stap wordt expliciet gemaakt om de lokale nuxt binary te gebruiken.
      - name: Build application
        run: |
          # Voer de build uit met de lokale node_modules/.bin/nuxt
          npm run build
        env:
          BACKEND_URL: "https://apijobbahub.azurewebsites.net"
          API_BASE_URL: "https://apijobbahub.azurewebsites.net/api"

      - name: Create deployment package
        # Zorg ervoor dat de output map correct is voor je framework (bijv. .output/public)
        run: |
          # Deze stap is afhankelijk van de exacte output van 'npm run build'
          # Controleer of '.output' de juiste map is
          zip -r app.zip .output -x "*.map"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip

  # ... (De configure-cors job blijft hetzelfde)
