name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: "keuzemodule-frontend"
  NODE_VERSION: "20.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    environment: "production"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          BACKEND_URL: "https://apijobbahub.azurewebsites.net"
          API_BASE_URL: "https://apijobbahub.azurewebsites.net/api"

      - name: Create deployment package
        run: zip -r app.zip .output -x "*.map"

      # ➡️ NIEUWE STAP: Azure Login met Service Principal
      # Je moet het 'AZURE_CREDENTIALS' secret aanmaken in GitHub.
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          # ⚠️ VERWIJDER DE PUBLISH PROFILE LIJN en vertrouw op de login stap
          # publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }} # NIET MEER NODIG
          package: app.zip

      # ➡️ Optionele stap: Logout na deployment
